<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Be My Valentine? 💕</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            overflow: hidden;
        }

        .container {
            background: white;
            border-radius: 30px;
            padding: 40px 30px;
            max-width: 500px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            position: relative;
        }

        .question-screen, .wrong-screen, .yes-screen {
            display: none;
        }

        .question-screen.active, .wrong-screen.active, .yes-screen.active {
            display: block;
        }

        h1 {
            font-size: 2.5rem;
            color: #333;
            margin-bottom: 20px;
            line-height: 1.2;
        }

        .heart {
            font-size: 5rem;
            margin: 30px 0;
            animation: heartbeat 1.5s ease-in-out infinite;
        }

        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            25% { transform: scale(1.1); }
            50% { transform: scale(1); }
        }

        .buttons {
            display: flex;
            gap: 20px;
            margin-top: 40px;
            flex-direction: column;
        }

        button {
            padding: 18px 40px;
            font-size: 1.3rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .yes-btn {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            box-shadow: 0 10px 25px rgba(245, 87, 108, 0.4);
        }

        .yes-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 35px rgba(245, 87, 108, 0.5);
        }

        .yes-btn:active {
            transform: translateY(-1px);
        }

        .no-btn {
            background: #e0e0e0;
            color: #666;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .no-btn:hover {
            background: #d0d0d0;
            transform: translateY(-2px);
        }

        .wrong-screen h2 {
            font-size: 2rem;
            color: #f5576c;
            margin-bottom: 20px;
        }

        .try-again-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 10px 25px rgba(118, 75, 162, 0.4);
            margin-top: 30px;
        }

        .try-again-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 35px rgba(118, 75, 162, 0.5);
        }

        .yes-screen {
            animation: fadeInScale 0.5s ease-out;
        }

        @keyframes fadeInScale {
            from {
                opacity: 0;
                transform: scale(0.8);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .yes-screen h2 {
            font-size: 3rem;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 30px;
        }

        .celebration {
            font-size: 4rem;
            margin: 20px 0;
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 2rem;
            }

            .heart {
                font-size: 4rem;
            }

            button {
                padding: 15px 30px;
                font-size: 1.1rem;
            }

            .yes-screen h2 {
                font-size: 2.2rem;
            }

            .celebration {
                font-size: 3rem;
            }
        }

        .floating-hearts {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1000;
        }

        .floating-heart {
            position: absolute;
            font-size: 2rem;
            opacity: 0;
            animation: float 4s ease-in-out;
        }

        @keyframes float {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(-100px) rotate(360deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <div class="floating-hearts" id="floatingHearts"></div>
    
    <div class="container">
        <!-- Question Screen -->
        <div class="question-screen active" id="questionScreen">
            <h1>Will You Be My Valentine Sydney?</h1>
            <div class="heart">💖 -Gabe</div>
            <div class="buttons">
                <button class="yes-btn" onclick="handleYes()">Yes! 💕</button>
                <button class="no-btn" onclick="handleNo()">No(???)</button>
            </div>
        </div>

        <!-- Wrong Answer Screen -->
        <div class="wrong-screen" id="wrongScreen">
            <h2>Wrong Answer! 💔😅 </h2>
             <p style="font-size: 1.3rem; color: #666; margin-top: 20px;">
                I'm hoping you pressed that because you wanted to see what happens. -_-
            </p>
            <button class="try-again-btn" onclick="tryAgain()">Try Again</button>
        </div>

        <!-- Yes Screen -->
        <div class="yes-screen" id="yesScreen">
            <h2>Come In! 💝</h2>
            <p style="font-size: 1.3rem; color: #666; margin-top: 20px;">
                I knew you'd say yes! 💖 Hopefully you like the gifts!
            </p>
        </div>
    </div>

    <script>
        function handleYes() {
            document.getElementById('questionScreen').classList.remove('active');
            document.getElementById('yesScreen').classList.add('active');
            createFloatingHearts();
        }

        function handleNo() {
            document.getElementById('questionScreen').classList.remove('active');
            document.getElementById('wrongScreen').classList.add('active');
        }

        function tryAgain() {
            document.getElementById('wrongScreen').classList.remove('active');
            document.getElementById('questionScreen').classList.add('active');
        }

        function createFloatingHearts() {
            const container = document.getElementById('floatingHearts');
            const hearts = ['💕', '💖', '💗', '💝', '❤️', '💘'];
            
            for (let i = 0; i < 20; i++) {
                setTimeout(() => {
                    const heart = document.createElement('div');
                    heart.className = 'floating-heart';
                    heart.textContent = hearts[Math.floor(Math.random() * hearts.length)];
                    heart.style.left = Math.random() * 100 + '%';
                    heart.style.animationDelay = Math.random() * 2 + 's';
                    container.appendChild(heart);
                    
                    setTimeout(() => heart.remove(), 4000);
                }, i * 200);
            }
        }
    </script>
</body>
</html>
